name: Release

# Builds the image, runs the tests, and pushes it to GitHub's container registry:
#
# Published releases (the commit must be on main):
#   vX.Y.Z-beta[.N]  →  ghcr.io/tamingit/sim-i:X.Y.Z-beta[.N]  and  :beta
#   vX.Y.Z           →  ghcr.io/tamingit/sim-i:X.Y.Z           and  :prod
#   Any other release tag is refused.
#
# Branch pushes:
#   feature/login    →  ghcr.io/tamingit/sim-i:feature-login   and  :preview-sha-<commit>
#   A branch whose name would be a release tag (prod, beta, 1.2.3 ...) is refused.
#
# Preview images (preview-sha-) not updated for 30 days are deleted nightly. Running the
# workflow by hand lists what would be deleted, without deleting it, unless dry_run is off.
#
#   gh release create v0.1.0-beta.1 --target main --prerelease --generate-notes   # beta
#   gh release create v0.1.0 --target main --generate-notes                       # prod

on:
  push:
    branches:
      - '**'

  release:
    types: [published]

  schedule:
    - cron: '17 4 * * *'

  workflow_dispatch:
    inputs:
      dry_run:
        description: 'List the preview images that would be deleted, without deleting them'
        type: boolean
        default: true

permissions:
  contents: read

# A release build always finishes. A newer push to a branch cancels the older run for it.
concurrency:
  group: sim-i-${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  IMAGE: ghcr.io/tamingit/sim-i

jobs:
  prepare:
    name: Check the release tag
    if: >-
      github.event_name == 'release' ||
      (github.event_name == 'push' && !github.event.deleted)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.tag.outputs.version }}
      channel: ${{ steps.tag.outputs.channel }}
    steps:
      - name: Check out repository
        if: github.event_name == 'release'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read the tag, and check it is on main
        if: github.event_name == 'release'
        id: tag
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-beta(\.[0-9]+)?)?$ ]]; then
            echo "Tag '$TAG' is neither vX.Y.Z (prod) nor vX.Y.Z-beta[.N] (beta); refusing to build." >&2
            exit 1
          fi

          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag '$TAG' is on a commit that isn't on main; refusing to build." >&2
            exit 1
          fi

          channel=prod
          [[ "$TAG" == *-beta* ]] && channel=beta

          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

  test:
    name: Tests
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The tests make their databases on this PostgreSQL (the scratch server: 127.0.0.1:54329).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: simi
          POSTGRES_PASSWORD: simi
          POSTGRES_DB: simi
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U simi"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          # The tests use examples/source, from the sim-i-example repository.
          submodules: true

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Tests
        run: dotnet test SimI.slnx

  publish:
    name: Build and push the image
    needs: [prepare, test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Make the image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch,enable=${{ github.event_name == 'push' }}
            type=sha,format=long,prefix=preview-sha-,enable=${{ github.event_name == 'push' }}
            type=raw,value=${{ needs.prepare.outputs.version }},enable=${{ github.event_name == 'release' }}
            type=raw,value=${{ needs.prepare.outputs.channel }},enable=${{ github.event_name == 'release' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Sim i, a development and test emulator for IBM i code
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.event_name == 'release' && needs.prepare.outputs.version || github.ref_name }}

      # A branch must not overwrite a release's tags.
      - name: Refuse branch names that are release tags
        if: github.event_name == 'push'
        shell: bash
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail

          # The branch's tag comes before the preview-sha- one.
          first_image="${IMAGE_TAGS%%$'\n'*}"
          tag="${first_image##*:}"

          if [[ "$tag" == "prod" ||
                "$tag" == "beta" ||
                "$tag" == "latest" ||
                "$tag" == preview-sha-* ||
                "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-beta(\.[0-9]+)?)?$ ]]; then
            echo "Branch tag '$tag' is a release tag name; refusing to push." >&2
            exit 1
          fi

      - name: Sign in to GitHub's registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        shell: bash
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Published images"
            while IFS= read -r tag; do
              [[ -n "$tag" ]] && echo "- \`$tag\`"
            done <<< "$IMAGE_TAGS"
          } >> "$GITHUB_STEP_SUMMARY"

  cleanup:
    name: Delete old preview images
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ENDPOINT: orgs/tamingit/packages/container/sim-i/versions
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
    steps:
      - name: Find and delete preview images not updated for 30 days
        shell: bash
        run: |
          set -euo pipefail

          cutoff="$(date -u -d '30 days ago' +'%Y-%m-%dT%H:%M:%SZ')"
          echo "Looking for preview images not updated since $cutoff"

          gh api --paginate --slurp "${ENDPOINT}?per_page=100" > versions.json

          # Only versions that weren't updated in 30 days, carry a preview-sha- tag,
          # and carry no release tag.
          jq -r --arg cutoff "$cutoff" '
            .[][] |
            select((.updated_at // .created_at) < $cutoff) |
            select(
              (.metadata.container.tags // []) |
              any(.[]; startswith("preview-sha-"))
            ) |
            select(
              (.metadata.container.tags // []) |
              all(.[];
                . != "prod" and
                . != "beta" and
                . != "latest" and
                (test("^[0-9]+\\.[0-9]+\\.[0-9]+(-beta(\\.[0-9]+)?)?$") | not)
              )
            ) |
            .id
          ' versions.json > expired-ids.txt

          count=0
          while IFS= read -r id; do
            [[ -n "$id" ]] || continue
            if [[ "$DRY_RUN" == "true" ]]; then
              echo "[dry run] would delete version $id"
            else
              echo "Deleting preview version $id"
              gh api -X DELETE "$ENDPOINT/$id"
            fi
            count=$((count + 1))
          done < expired-ids.txt

          echo "Preview versions matched: $count"

          {
            echo "### Preview image cleanup"
            echo "Cutoff: $cutoff"
            echo "Matched versions: $count"
            echo "Dry run: $DRY_RUN"
          } >> "$GITHUB_STEP_SUMMARY"
