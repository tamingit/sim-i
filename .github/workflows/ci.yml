name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The tests make their databases on this PostgreSQL (the scratch server: 127.0.0.1:54329).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fakeibmi
          POSTGRES_PASSWORD: fakeibmi
          POSTGRES_DB: fakeibmi
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U fakeibmi"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Tests
        run: dotnet test FakeIbmI.slnx
      - name: Image
        run: docker build .
